# Security headers for www.joe13th.com.
#
# nginx serves cached pages itself (x-cache-status: STATIC), so the headers
# Next.js sets in next.config.mjs never reach most visitors. Copy this file to
# /etc/nginx/snippets/ and include it in the site's `server { ... }` block:
#
#     include snippets/security-headers.conf;
#
# Note: nginx drops server-level add_header lines inside any `location` that has
# its own add_header, so repeat the include in those locations too.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Keep the CSP in sync with next.config.mjs.

add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https:; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Hide the nginx version in the Server header.
server_tokens off;
